[project]
name = "sensorfield-px4-4"
version = "0.1.0"
description = "PX4.4: night-mode human tracking turret on Jetson Orin Nano (ROS 2 + TensorRT)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    ".git",
    "build",
    "install",
    "log",
    "SeamlessTrack/build",
    "SeamlessTrack/install",
    "SeamlessTrack/log",
    "SeamlessTrack/engines",
    "SeamlessTrack/bench/results",
    "PX4.3_archive",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
